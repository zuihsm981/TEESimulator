name: Build

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Target ABI (all builds both arm64 and x86_64)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - arm64-v8a
          - x86_64
      build_type:
        description: 'Build type (release/debug/both)'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - release
          - debug

jobs:
  module:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 保留以防您想手动发布 release，当前未使用
    env:
      NDK_VERSION: "28.2.13676358"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0   # 如需基于 commit 计数的版本号可保留

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build golang-go clang libclang-dev zip

      - name: Set up the Android SDK and NDK
        uses: android-actions/setup-android@v3
      - name: Install NDK, CMake and build-tools
        run: sdkmanager --install "ndk;${NDK_VERSION}" "cmake;3.22.1" "build-tools;36.0.0" "platforms;android-36"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Rust
        run: |
          # 预先添加所有可能用到的 target（build.sh 通过 NDK 环境变量自行切换）
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            rust/target
          key: cargo-${{ hashFiles('rust/**/Cargo.toml') }}

      # ---------- 构建 Rust 静态库（按需循环） ----------
      - name: Build Rust libraries for selected ABIs
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: |
          set -euo pipefail
          # 确定要构建的 ABI 列表
          if [ "${{ inputs.architecture }}" == "all" ]; then
            ABIS=("arm64-v8a" "x86_64")
          else
            ABIS=("${{ inputs.architecture }}")
          fi
          for abi in "${ABIS[@]}"; do
            echo "Building Rust library for $abi"
            export ABI="$abi"
            ./rust/build.sh build
          done

      # ---------- 构建 Android 模块（通过 Gradle） ----------
      - name: Build the module via Gradle
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: |
          GRADLE_ARGS=""
          # 如果只构建单一 ABI，可添加属性以限制 Gradle 仅打包该 ABI
          if [ "${{ inputs.architecture }}" != "all" ]; then
            GRADLE_ARGS="$GRADLE_ARGS -Pandroid.injected.build.abi=${{ inputs.architecture }}"
          fi

          if [ "${{ inputs.build_type }}" == "both" ]; then
            ./gradlew zipRelease zipDebug $GRADLE_ARGS
          elif [ "${{ inputs.build_type }}" == "release" ]; then
            ./gradlew zipRelease $GRADLE_ARGS
          elif [ "${{ inputs.build_type }}" == "debug" ]; then
            ./gradlew zipDebug $GRADLE_ARGS
          fi

      # ---------- 解压并上传产物 ----------
      - name: Stage the module artifacts
        id: artifacts
        run: |
          set -euo pipefail
          if [ "${{ inputs.build_type }}" == "both" ] || [ "${{ inputs.build_type }}" == "release" ]; then
            REL_ZIP=$(ls out/TEESimulator-*-Release.zip 2>/dev/null || true)
            if [ -n "$REL_ZIP" ]; then
              mkdir -p artifact-release
              unzip -q "$REL_ZIP" -d artifact-release
              echo "release=$(basename "$REL_ZIP" .zip)" >> "$GITHUB_OUTPUT"
            fi
          fi
          if [ "${{ inputs.build_type }}" == "both" ] || [ "${{ inputs.build_type }}" == "debug" ]; then
            DBG_ZIP=$(ls out/TEESimulator-*-Debug.zip 2>/dev/null || true)
            if [ -n "$DBG_ZIP" ]; then
              mkdir -p artifact-debug
              unzip -q "$DBG_ZIP" -d artifact-debug
              echo "debug=$(basename "$DBG_ZIP" .zip)" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Upload release module (if built)
        if: steps.artifacts.outputs.release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifacts.outputs.release }}
          path: artifact-release/*
          if-no-files-found: error

      - name: Upload debug module (if built)
        if: steps.artifacts.outputs.debug
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifacts.outputs.debug }}
          path: artifact-debug/*
          if-no-files-found: error